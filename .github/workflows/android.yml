
name: Build ZenIsland v0.4.0

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ZenIsland APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract New ZIP
        run: |
          ZIP="ZenIsland-v0.4.0.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: New ZIP not found!"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/zenisland"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/zenisland"

          PROJECT=$(find "$RUNNER_TEMP/zenisland" \
            -name settings.gradle.kts -printf '%h\n' \
            | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Gradle project not found in ZIP!"
            exit 1
          fi

          test -f "$PROJECT/app/build.gradle.kts"

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload ZenIsland APK
        uses: actions/upload-artifact@v4
        with:
          name: ZenIsland-v0.4.0-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
