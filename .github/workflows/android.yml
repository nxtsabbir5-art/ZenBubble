name: ZenBubble Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract source code
        run: |
          unzip -o droidbubble-1.3.0.zip -d source

      - name: Build APK
        working-directory: source/droidbubble-1.3.0
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZenBubble-APK
          path: source/droidbubble-1.3.0/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
