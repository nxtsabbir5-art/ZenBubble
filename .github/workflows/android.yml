
name: ZenBubble APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'ZenBubble_Notification_Island_Neon_Glass_Theme.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Extract ZenBubble ZIP
        run: |
          mkdir source
          unzip -o ZenBubble_Notification_Island_Neon_Glass_Theme.zip -d source

      - name: Locate Gradle Project
        run: |
          PROJECT_DIR=$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Gradle project not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload ZenBubble APK
        uses: actions/upload-artifact@v4
        with:
          name: ZenBubble-Neon-Glass-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
