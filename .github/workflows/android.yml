
name: DroidBubble Offline APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Extract ZIP and Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Accept SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Extract DroidBubble Source ZIP
        run: |
          mkdir -p source
          unzip -q DroidBubble-Dynamic-Eye-Offline-GitHub.zip -d source

      - name: Verify Project Files
        run: |
          test -f source/gradlew
          test -f source/settings.gradle.kts
          test -f source/app/build.gradle.kts
          echo "Source ZIP extracted successfully"

      - name: Grant Gradle Permission
        run: chmod +x source/gradlew

      - name: Build Debug APK
        working-directory: source
        run: |
          ./gradlew --no-daemon \
            --stacktrace \
            clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DroidBubble-Offline-APK
          path: source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
