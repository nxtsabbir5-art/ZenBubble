
name: DroidBubble Offline APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Extract ZIP and Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools'

      - name: Install Android SDK Packages
        run: |
          sdkmanager "platforms;android-36" \
            "build-tools;36.0.0"
          
      - name: Extract Source ZIP
        run: |
          mkdir -p source
          unzip -q DroidBubble-Dynamic-Eye-Offline-GitHub.zip -d source

      - name: Locate Gradle Project
        run: |
          find source -name settings.gradle.kts
          test -f source/gradlew

      - name: Prepare Gradle
        run: chmod +x source/gradlew

      - name: Build Debug APK
        working-directory: source
        run: |
          ./gradlew --no-daemon clean assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DroidBubble-Offline-APK
          path: source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
