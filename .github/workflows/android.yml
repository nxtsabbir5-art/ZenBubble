
name: Build ZenIsland v0.3.0

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Latest ZenIsland
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract ZenIsland v0.3.0
        run: |
          ZIP="ZenIsland-v0.3.0.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: New ZenIsland ZIP not found!"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/zenisland-v030"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/zenisland-v030"

          PROJECT="$RUNNER_TEMP/zenisland-v030"

          test -f "$PROJECT/settings.gradle.kts"
          test -f "$PROJECT/build.gradle.kts"
          test -f "$PROJECT/app/build.gradle.kts"
          test -f "$PROJECT/app/src/main/java/com/zenisland/app/FaceView.kt"
          test -f "$PROJECT/app/src/main/java/com/zenisland/app/IslandService.kt"

          grep -q 'versionName = "0.3.0"' \
            "$PROJECT/app/build.gradle.kts"

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:assembleDebug

      - name: Upload ZenIsland APK
        uses: actions/upload-artifact@v4
        with:
          name: ZenIsland-v0.3.0-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
