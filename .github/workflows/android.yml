name: Build ZenIsland APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ZenIsland
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract ZenIsland Source
        run: |
          ZIP="./ZenIsland-Starter-0.1.0.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ZenIsland ZIP not found!"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/ZenIsland"
          unzip -o "$ZIP" -d "$RUNNER_TEMP/ZenIsland"

      - name: Verify Gradle Project
        run: |
          PROJECT="$RUNNER_TEMP/ZenIsland"

          if [ ! -f "$PROJECT/settings.gradle.kts" ]; then
            echo "settings.gradle.kts missing!"
            find "$PROJECT" -maxdepth 3 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:assembleDebug

      - name: Upload ZenIsland APK
        uses: actions/upload-artifact@v4
        with:
          name: ZenIsland-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
