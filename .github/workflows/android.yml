
name: Zen Bubble APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Zenbubble 4.0.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Extract New Zen Bubble ZIP
        run: |
          set -euo pipefail
          ZIP_FILE="Zenbubble 4.0.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: New ZIP file not found!"
            exit 1
          fi

          rm -rf source
          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

      - name: Locate Gradle Project
        id: project
        run: |
          set -euo pipefail

          PROJECT_FILE="$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"

          if [ -z "$PROJECT_FILE" ]; then
            echo "Gradle project not found!"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "gradlew not found!"
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build Fresh APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug --stacktrace

      - name: Upload Zen Bubble APK
        uses: actions/upload-artifact@v4
        with:
          name: Zen-Bubble-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
